<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Countdown — track the time remaining until dates that matter to you.">
  <title>Countdown — eskonworks</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/mini.css">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="mini-app wide">
    <a class="back-link" href="../index.html">← All projects</a>
    <header class="app-head">
      <h1>Countdown</h1>
      <p>Days, hours, minutes and seconds until your next big moment.</p>
    </header>

    <section class="panel add-form">
      <input type="text" id="eventName" maxlength="50" placeholder="Event name (e.g. Summer trip)" aria-label="Event name" required>
      <input type="date" id="eventDate" aria-label="Event date" required>
      <button type="button" id="addBtn" class="primary">Add</button>
    </section>

    <div class="countdown-grid" id="countdownGrid"></div>
    <p class="muted small" id="emptyNote" hidden>No countdowns yet — add one above.</p>
    <p class="muted small">Your events are saved in this browser only.</p>
  </main>
</body>
</html>
