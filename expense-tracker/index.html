<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker — eskonworks</title>
  <link rel="stylesheet" href="../assets/mini.css">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="mini-app">
    <a class="back-link" href="../index.html">← All projects</a>
    <header class="app-head">
      <h1>Expense Tracker</h1>
      <p>A tiny budget ledger. Everything stays in this browser.</p>
    </header>

    <section class="panel">
      <form id="expense-form" class="entry-form">
        <label>
          <span>What</span>
          <input id="description" type="text" placeholder="e.g. Coffee" required maxlength="60">
        </label>
        <label>
          <span>Amount</span>
          <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
        </label>
        <label>
          <span>Category</span>
          <select id="category">
            <option>Food</option>
            <option>Transport</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Fun</option>
            <option>Other</option>
          </select>
        </label>
        <button type="submit" class="primary">Add</button>
      </form>
    </section>

    <section class="summary">
      <div><strong id="total">$0.00</strong><span>This month</span></div>
      <div><strong id="count">0</strong><span>Expenses</span></div>
      <div><strong id="top-category">—</strong><span>Top category</span></div>
    </section>

    <section class="panel breakdown-panel">
      <h2>By category</h2>
      <div id="breakdown" class="breakdown"><p class="muted small">No expenses yet.</p></div>
    </section>

    <section class="panel list-panel">
      <div class="list-head">
        <h2>Transactions</h2>
        <select id="filter" class="filter" aria-label="Filter transactions">
          <option value="all">All categories</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Fun</option>
          <option>Other</option>
        </select>
      </div>
      <div id="expense-list" class="expense-list"></div>
    </section>
  </main>
</body>
</html>
