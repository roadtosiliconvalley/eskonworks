<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Match — eskonworks</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/mini.css">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="mini-app">
    <a class="back-link" href="../index.html">← All projects</a>
    <header class="app-head">
      <h1>Memory Match</h1>
      <p>Flip two cards at a time and find all eight pairs.</p>
    </header>

    <section class="panel game-panel">
      <div class="hud">
        <div><span>Moves</span><strong id="moves">0</strong></div>
        <div><span>Time</span><strong id="time">00:00</strong></div>
        <div><span>Best</span><strong id="best">—</strong></div>
      </div>

      <div class="board" id="board" aria-label="Memory match board"></div>

      <p class="status muted" id="status" role="status">Pick a card to start.</p>
      <div class="controls">
        <button type="button" class="primary" id="restartBtn">Restart</button>
        <button type="button" id="shuffleBtn">Shuffle</button>
      </div>
    </section>
  </main>
</body>
</html>
