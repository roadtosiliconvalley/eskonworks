<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game">
    <div class="head">
      <div>
        <h1>Snake</h1>
        <p class="hint">Arrow keys or WASD to move</p>
      </div>
      <div class="stats">
        <div><span>Score</span><strong id="score">0</strong></div>
        <div><span>Best</span><strong id="best">0</strong></div>
      </div>
    </div>

    <div class="stage">
      <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
      <div class="overlay" id="overlay">
        <p id="overlayTitle">Ready?</p>
        <p id="overlayText">Press Start to play</p>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="primary">Start</button>
      <button id="restartBtn" class="secondary">Restart</button>
    </div>

    <div class="dpad" aria-label="On-screen controls">
      <button data-dir="up">↑</button>
      <div>
        <button data-dir="left">←</button>
        <button data-dir="down">↓</button>
        <button data-dir="right">→</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
