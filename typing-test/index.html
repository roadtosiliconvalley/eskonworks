<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Typing Test — measure words per minute and accuracy across short passages.">
  <title>Typing Test — eskonworks</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/mini.css">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="mini-app wide">
    <a class="back-link" href="../index.html">← All projects</a>
    <header class="app-head">
      <h1>Typing Test</h1>
      <p>Type the passage as accurately as you can. The clock starts on your first keystroke.</p>
    </header>

    <section class="panel">
      <div class="toolbar">
        <label>Passage <select id="passageSelect"></select></label>
        <button type="button" id="restartBtn">Restart</button>
      </div>
      <div class="stats">
        <div><strong id="wpm">0</strong><span>WPM</span></div>
        <div><strong id="accuracy">100%</strong><span>Accuracy</span></div>
        <div><strong id="time">0.0s</strong><span>Time</span></div>
      </div>
      <div class="passage" id="passage" aria-label="Typing passage"></div>
      <textarea id="typingInput" rows="3" placeholder="Click here and start typing…" autocomplete="off" spellcheck="false"></textarea>
      <p class="muted small" id="message">Waiting for your first character.</p>
    </section>
  </main>
</body>
</html>
